services:
  skystats:
    image: ${SKYSTATS_CONTAINER}
    depends_on:
      skystats-db:
        condition: service_healthy
    ports:
      - "${AF_SKYSTATS_PORT}:80"
    container_name: skystats
    # cap this container's log on the SD card (Docker's default has no limit)
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    hostname: skystats
    restart: unless-stopped
    stop_grace_period: 30s
    networks:
      - adsb_im_bridge
    environment:
      # ADSB -- note, if this is an external ultrafeeder, you may need port 8080
      - READSB_AIRCRAFT_JSON=${SKYSTATS_AIRCRAFT_JSON:-http://ultrafeeder/data/aircraft.json}
      # PostgreSQL
      - DB_HOST=${SKYSTATS_DB_HOST}
      - DB_PORT=${SKYSTATS_DB_PORT}
      - DB_USER=${SKYSTATS_DB_USER}
      - DB_PASSWORD=${SKYSTATS_DB_PASSWORD}
      - DB_NAME=${SKYSTATS_DB_NAME}
      # App
      - LAT=${FEEDER_LAT}
      - LON=${FEEDER_LONG}
      - RADIUS=${SKYSTATS_RADIUS}
      - ABOVE_RADIUS=${SKYSTATS_ABOVE_RADIUS}
      - DOMESTIC_COUNTRY_ISO=${SKYSTATS_DOMESTIC_COUNTRY_ISO}
      # delete flights older than this many days (0 = keep forever)
      - RETENTION_DAYS=${SKYSTATS_RETENTION_DAYS:-0}
      # starting units for the web page: nautical, imperial or metric
      - DEFAULT_UNITS=${FEEDER_DISPLAY_UNITS:-nautical}
      - LOG_LEVEL=${SKYSTATS_LOG_LEVEL:-INFO}
      # USER_PROVIDED_ENV_START
      # USER_PROVIDED_ENV_END
