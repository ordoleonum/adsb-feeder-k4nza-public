services:
  webproxy:
    container_name: webproxy
    # cap this container's log on the SD card (Docker's default has no limit)
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    hostname: webproxy
    image: ${WEBPROXY_CONTAINER}
    healthcheck:
      disable: true
    restart: unless-stopped
    networks:
      - adsb_im_bridge
    ports:
      - ${AF_TAR1090_PORT:-8080}:80 # to expose the web interface
    environment:
      - S6_KILL_GRACETIME=1000
      - VERBOSE_LOG=ON
      - AUTOGENERATE=OFF
      # USER_PROVIDED_ENV_START
      # USER_PROVIDED_ENV_END
    tmpfs:
      - /run:exec,size=64M
      - /var/log
    volumes:
      - /opt/adsb/webproxy:/run/nginx
      - /etc/localtime:/etc/localtime:ro

