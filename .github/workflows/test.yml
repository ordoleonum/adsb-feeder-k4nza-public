name: Test Suite

# Runs the test suite on several Python versions; every test except the one
# deselected below must pass. See tests/TEST_STATUS.md.

on:
  push:
    branches: [ main, beta, dev*, test* ]
  pull_request:
    branches: [ main, beta ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      # Python 3.9 is no longer available on GitHub's runners; the Pi image uses a newer Python
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install uv
      uses: astral-sh/setup-uv@v7

    - name: Install dependencies
      run: |
        uv sync --group dev

    - name: Set up test environment
      run: |
        # Create temporary test directory for ADSB_BASE_DIR
        mkdir -p /tmp/adsb-test-ci
        export ADSB_BASE_DIR=/tmp/adsb-test-ci
        echo "ADSB_BASE_DIR=/tmp/adsb-test-ci" >> $GITHUB_ENV

    - name: Run all passing tests with coverage (must pass)
      run: |
        # One upstream test is known to fail (it patches open() in a way read_values_from_env_file
        # doesn't use); everything else must pass
        uv run pytest tests/ -v \
          --cov=src/modules/adsb-feeder/filesystem/root/opt/adsb/adsb-setup \
          --cov-report=xml \
          --cov-report=html \
          --cov-report=term-missing \
          --deselect=tests/unit/test_config.py::TestReadValuesFromEnvFile::test_read_env_file_missing

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install uv
      uses: astral-sh/setup-uv@v7

    - name: Install linting dependencies
      run: |
        uv sync --group dev

    - name: Run flake8
      run: |
        uv run flake8 src/modules/adsb-feeder/filesystem/root/opt/adsb/adsb-setup/ --count --select=E9,F63,F7,F82 --show-source --statistics
        uv run flake8 src/modules/adsb-feeder/filesystem/root/opt/adsb/adsb-setup/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Run black
      run: |
        uv run black --diff --check --line-length=130 src/modules/adsb-feeder/filesystem/root/opt/adsb/adsb-setup/

    - name: Run mypy
      run: |
        uv run mypy src/modules/adsb-feeder/filesystem/root/opt/adsb/adsb-setup/ --ignore-missing-imports
